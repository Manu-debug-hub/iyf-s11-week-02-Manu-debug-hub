<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — manu.dev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="navbar">
  <div class="container">
    <a href="index.html" class="navbar__logo">manu<span>.dev</span></a>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
    <ul class="navbar__links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </div>
</header>

<main>
  <section>
    <div class="container">
      <p class="eyebrow">get-in-touch</p>
      <h1>Contact</h1>

      <div class="contact-layout">
        <form class="contact-form" onsubmit="return false;">
          <div>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name">
          </div>
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com">
          </div>
          <div>
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" placeholder="Say hello..."></textarea>
          </div>
          <button type="submit" class="button button--solid" style="align-self:flex-start;">Send message</button>
        </form>

        <aside class="contact-sidebar">
          <h4>Elsewhere</h4>
          <p class="text-sm" style="margin-top:0.75rem;">
            <a href="https://github.com/Manu-debug-hub" class="link">GitHub — @Manu-debug-hub</a>
          </p>
          <p class="text-sm" style="margin-top:0.5rem;">Usually replies within a day or two.</p>
        </aside>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p class="footer-copyright">© 2026 manu.dev — built with HTML &amp; CSS</p>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
